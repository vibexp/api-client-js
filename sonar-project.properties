# SonarCloud (SonarQube) scanner configuration for vibexp/api-client-js.
#
# CI-based analysis (see the sonar job in .github/workflows/ci.yml), NOT
# SonarCloud Automatic Analysis — the two modes are mutually exclusive, so
# Automatic Analysis must be turned OFF for this project in the SonarCloud UI
# (Administration -> Analysis Method) or CI analysis is rejected. Part of the
# org-wide rollout (issue #4, companion to vibexp/vibexp#300).

sonar.organization=vibexp
sonar.projectKey=vibexp_api-client-js

# Only the hand-written wrapper layer is analyzed. Most of src/ is GENERATED
# from the OpenAPI spec at build time (npm run generate) and gitignored —
# src/schema.ts, src/axios/** and openapi.bundled.yaml never reach a fresh
# checkout — but they are excluded explicitly as defense in depth in case a
# future workflow generates before scanning. No test suite yet → no coverage
# ingestion (code-quality/security analysis still runs).
sonar.sources=src
sonar.exclusions=src/schema.ts,src/axios/**,openapi.bundled.yaml,dist/**
