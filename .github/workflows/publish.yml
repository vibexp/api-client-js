name: Publish

# Release-driven publish: creating a GitHub Release (tag `v*`) generates the
# client from the backend spec and publishes it to the public npm registry.
# The version is derived from the release tag (v0.1.0 -> 0.1.0), and the spec
# is generated from vibexp/vibexp at the same tag by default.
#
# The smoke type-check (npm run smoke, invoked by the build) is the generation
# gate — if generation produced empty/broken output the job fails and nothing
# is published.
#
# workflow_dispatch is both a manual override and the automation entrypoint:
# vibexp's spec-change workflow dispatches this with backend_ref=main and no
# version, which auto-resolves to the next patch bump (see the resolve step).
# For a manual one-off, pass version + backend_ref explicitly.
#
# Publishing uses npm Trusted Publishing (OIDC) — no NPM_TOKEN secret. The
# package's npm settings must list this repo + workflow as a trusted publisher,
# and the job needs `id-token: write`. Provenance is generated automatically.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'npm version to publish (default: release tag, else auto patch-bump)'
        required: false
      backend_ref:
        description: 'vibexp/vibexp git ref to generate from (default: the release tag)'
        required: false

permissions:
  contents: read
  id-token: write   # OIDC token for npm Trusted Publishing

jobs:
  publish:
    name: Generate, gate & publish
    runs-on: ubuntu-latest

    steps:
      - name: Resolve version & backend ref
        id: resolve
        env:
          TAG: ${{ github.event.release.tag_name }}
          IN_VERSION: ${{ inputs.version }}
          IN_BACKEND_REF: ${{ inputs.backend_ref }}
        run: |
          # Version precedence: explicit input > release tag > auto patch-bump.
          # The auto path (empty version, no tag) is what vibexp's spec-change
          # workflow_dispatch uses: bump the patch off the latest published
          # version so every spec change lands as a new release with no human
          # picking a number. Reading the latest version each run keeps
          # back-to-back merges from colliding on the same version.
          version="${IN_VERSION:-${TAG#v}}"
          if [ -z "$version" ]; then
            latest="$(npm view @vibexp/api-client version 2>/dev/null || true)"
            if [ -z "$latest" ]; then
              echo "::error::Could not read the latest published @vibexp/api-client version for the auto patch-bump."
              exit 1
            fi
            version="$(node -e 'const [a,b,c]=process.argv[1].split("."); if([a,b,c].some(x=>x===undefined||!/^\d+$/.test(x))){process.exit(1)} console.log(`${a}.${b}.${Number(c)+1}`)' "$latest")"
            echo "Auto patch-bump: $latest -> $version"
          fi
          backend_ref="${IN_BACKEND_REF:-${TAG}}"
          if [ -z "$version" ] || [ -z "$backend_ref" ]; then
            echo "::error::Could not resolve version/backend_ref. For a manual run, provide the 'version' and 'backend_ref' inputs."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "backend_ref=$backend_ref" >> "$GITHUB_OUTPUT"
          echo "Publishing @vibexp/api-client@$version (spec from vibexp/vibexp@$backend_ref)"

      - name: Checkout api-client
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3

      - name: Checkout backend spec source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          repository: vibexp/vibexp
          ref: ${{ steps.resolve.outputs.backend_ref }}
          path: spec-src

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false   # never cache in release builds

      # Trusted Publishing (OIDC) requires npm >= 11.5.1. Pin to 11.18.0 (the last
      # known-good release) rather than @latest: npm 12.0.0 ships a broken provenance
      # path ("Cannot find module 'sigstore'") that fails `npm publish` under OIDC.
      - name: Ensure recent npm
        run: npm install -g npm@11.18.0

      - name: Install dependencies
        run: npm install

      - name: Set package version
        run: npm version "${{ steps.resolve.outputs.version }}" --no-git-tag-version --allow-same-version

      # Generates types + axios SDK, compiles to dist/, then type-checks smoke/
      # against the generated output. This is the generation gate before publish.
      - name: Generate, build & smoke type-check
        run: npm run smoke
        env:
          VIBEXP_SPEC: spec-src/backend/openapi.yaml

      # No NODE_AUTH_TOKEN: auth comes from the OIDC id-token (Trusted Publisher).
      # Provenance attestation is generated automatically.
      - name: Publish to npm
        run: npm publish --access public
